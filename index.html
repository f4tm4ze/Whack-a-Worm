<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Whack-a-Worm - A chicken-themed whacking game with difficulty levels">
    <meta name="author" content="Bai Fatima Andong">
    <title>Whack-a-Worm | Chicken vs Worms</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- Logo Header -->
        <div class="logo-header">
            <img src="logo.png" alt="Whack-a-Worm Logo" class="game-logo" id="gameLogo">
            <h1 class="game-title">WHACK-A-WORM</h1>
        </div>

        <div class="game-container">
            <!-- Score Panel -->
            <div class="header">
                <div class="score-card">
                    <div class="card-label">SCORE</div>
                    <div class="card-value" id="scoreValue">0</div>
                </div>
                <div class="timer-card">
                    <div class="card-label">TIME</div>
                    <div class="card-value" id="timerValue">30</div>
                </div>
                <div class="best-card">
                    <div class="card-label">BEST</div>
                    <div class="card-value" id="bestValue">0</div>
                </div>
            </div>

            <!-- Difficulty Level Selector -->
            <div class="difficulty-section">
                <label class="difficulty-label">DIFFICULTY LEVEL</label>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn" data-difficulty="normal" id="normalBtn">NORMAL</button>
                    <button class="difficulty-btn" data-difficulty="fast" id="fastBtn">FAST</button>
                    <button class="difficulty-btn" data-difficulty="insane" id="insaneBtn">INSANE</button>
                </div>
            </div>

            <!-- Game Grid -->
            <div class="grid" id="holesGrid">
                <!-- 9 holes injected by JS -->
            </div>

            <!-- Control Buttons -->
            <div class="controls">
                <button id="resetBtn" class="btn btn-reset">RESET GAME</button>
            </div>

            <!-- Message Area for Feedback -->
            <div class="message-area" id="gameMessage">
                <span class="message-emoji">🐤</span>
                <span class="message-text">Click the worms! Chicken will peck them!</span>
            </div>
        </div>

        <!-- Footer - Plain text only -->
        <footer>
             © 2026 Bai Fatima Andong. All rights reserved.
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
